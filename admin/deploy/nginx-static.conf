# Include inside the existing cloud HTTPS/IP server blocks.
root /var/www/yeweiyi-admin/current;
index index.html;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location = /index.html {
    add_header Cache-Control "no-store" always;
}
location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|map|json|txt)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}
location / {
    # Umi exportStatic also writes route directories; always use the SPA shell.
    try_files /index.html =404;
}
