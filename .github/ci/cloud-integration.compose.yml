# Cloud CI 集成测试专用的 Compose 覆盖文件（自托管 Runner）。
#
# 叠加在 cloud/docker-compose.yml 与 docker-compose.thingsboard.yml 之上，配合每次运行唯一的
# `-p <project>` 使用。目的：本次运行的容器、网络、卷、端口都只属于这一个 Compose 项目，
# 结束时 `down -v` 只删自己的东西，不需要也不允许全局 prune。
#
# 为什么共享网络命名空间而不是改宿主端口：
# - 同一台虚拟机上 KeywordIQ 的 CI 也会把 PostgreSQL 发布到宿主 5432，两边抢端口会让对方失败；
# - 部分集成测试无条件探测 localhost:8081（见 internal/api/alarms_test.go、internal/ingest/ingest_test.go），
#   换宿主端口就会 Skip，而 Skip 在 CI 里按失败处理。
# 所以 PostgreSQL / Redis / ThingsBoard 和跑 go test 的容器共用 `netns` 服务的网络命名空间：
# 测试仍然连 localhost:8081/1884/6379，但这些端口只存在于本次运行的命名空间里，宿主上一个都不发布。
#
# tb-postgres 镜像自带的 PostgreSQL 占用命名空间内的 5432，所以业务库改到 55432，
# 测试统一经 DATABASE_URL 连接（工作流里设置）。
services:
  netns:
    # 与 cloud/go.mod 的 go 版本一致，由工作流从 go.mod 解析后传入。
    image: ${CI_GO_IMAGE:?CI_GO_IMAGE 未设置}
    command: ["sleep", "infinity"]
    init: true
    user: "${CI_UID:?}:${CI_GID:?}"
    working_dir: /src/cloud
    environment:
      HOME: /tmp
      GOTOOLCHAIN: local
      GOMODCACHE: /cache/gomod
      GOCACHE: /cache/gobuild
      PATH: /opt/ci-bin:/usr/local/go/bin:/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DATABASE_URL: postgres://yeweiyi:yeweiyi@localhost:55432/yeweiyi?sslmode=disable
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: localhost,127.0.0.1
    volumes:
      - ${GITHUB_WORKSPACE:?}:/src
      - ${YEWEIYI_CI_CACHE:?}/gomod:/cache/gomod
      - ${YEWEIYI_CI_CACHE:?}/gobuild:/cache/gobuild
      - ${CI_BIN_DIR:?}:/opt/ci-bin:ro

  postgres:
    container_name: !reset null
    ports: !reset []
    network_mode: service:netns
    command: ["postgres", "-p", "55432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yeweiyi -p 55432"]

  redis:
    container_name: !reset null
    ports: !reset []
    network_mode: service:netns

  thingsboard:
    container_name: !reset null
    ports: !reset []
    network_mode: service:netns
    environment:
      HTTP_BIND_PORT: "8081"
      MQTT_BIND_PORT: "1884"
    # 这台虚拟机与 KeywordIQ 共用（3 vCPU / 5 GiB）。设上限，避免 ThingsBoard 把对方挤到 OOM；
    # JAVA_OPTS 仍是 -Xmx2G，额外留给自带 PostgreSQL 与 JVM 非堆内存。
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/login || exit 1"]
