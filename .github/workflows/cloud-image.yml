name: Cloud Image

on:
  push:
    branches: [main]
    paths: ["cloud/**", ".github/workflows/cloud-image.yml"]
    tags: ["cloud-v*"]
  pull_request:
    paths: ["cloud/Dockerfile", "cloud/.dockerignore", "cloud/go.mod", "cloud/go.sum", "cloud/cmd/**", "cloud/internal/**", ".github/workflows/cloud-image.yml"]

permissions:
  contents: read

# PR 上新提交取消旧运行，别让过时的构建占着唯一的自托管 Runner；main 与 tag 上不取消（部署要用）。
concurrency:
  group: cloud-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 只在 PR 上判定复用（与上次成功构建的 cloud/、.github/ 相同就不再构建）；main 与 tag 每次都构建并推送，部署要用。
  reuse:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, yeweiyi-ci]
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.check.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-reuse.sh "Cloud Image" >> "$GITHUB_OUTPUT"

  image:
    needs: reuse
    # !cancelled()：reuse 在 push 上被跳过时仍要构建。
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.reuse.outputs.reuse != 'true') }}
    runs-on: [self-hosted, linux, x64, yeweiyi-ci]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # 自托管 Runner 的 HOME 跨 job 持久：登录凭证若写进 ~/.docker 会残留到之后的 job。
      # 改用本 job 的 RUNNER_TEMP 下的临时目录，收尾步骤 always 删除。
      - name: 临时 Docker 配置目录与本地构建缓存路径
        id: prep
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          cache="${YEWEIYI_CI_CACHE:?}/buildx/cloud-image"
          mkdir -p "$cache"
          echo "cache=$cache" >> "$GITHUB_OUTPUT"
          echo "构建缓存目录：$cache（$(du -sh "$cache" | cut -f1)）"
          # BuildKit 的 RUN 步骤不继承守护进程的代理配置；go mod download 需要经本机代理访问 proxy.golang.org。
          # 代理参数是 BuildKit 预定义参数，不进入镜像历史与层内容。
          {
            echo 'build_args<<EOF'
            [[ -n "${HTTPS_PROXY:-}" ]] && echo "HTTPS_PROXY=$HTTPS_PROXY"
            [[ -n "${HTTP_PROXY:-}" ]] && echo "HTTP_PROXY=$HTTP_PROXY"
            [[ -n "${NO_PROXY:-}" ]] && echo "NO_PROXY=$NO_PROXY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      # docker 驱动直接使用本机守护进程（containerd 镜像存储，支持 local 缓存导出与证明），
      # 不另起 BuildKit 容器。
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: 登录 GHCR（仅推送时）
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # 单仓库自己的包（随本仓库创建、自动授权）；合并前的旧镜像在 ghcr.io/<owner>/yeweiyi-cloud。
          images: ghcr.io/${{ github.repository_owner }}/yeweiyi/cloud
          tags: |
            type=sha
            type=match,pattern=cloud-(v.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}
      # 推送到 ghcr.io 出境上传时常超时（2026-11-23 两次 timeout awaiting response headers）。失败时下一步原样重试一次：
      # 层都在本机缓存里，重试几乎只剩上传。PR 不推送，不重试。
      - id: build
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v7
        env:
          # 不把 .dockerbuild 构建记录作为 artifact 上传（收尾不经代理上传任何东西）；摘要照常写入。
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: cloud
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.prep.outputs.build_args }}
          # 本机持久目录作构建缓存，不再上传 GitHub 缓存（type=gha）。
          # 写到新目录再替换旧目录：local 缓存原地写入会无限增长。
          cache-from: type=local,src=${{ steps.prep.outputs.cache }}
          cache-to: type=local,dest=${{ steps.prep.outputs.cache }}-new,mode=max
      - name: 重试前清掉上次写了一半的缓存目录
        if: steps.build.outcome == 'failure'
        env:
          CACHE: ${{ steps.prep.outputs.cache }}
        run: rm -rf "${CACHE:?}-new"
      - id: retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: cloud
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.prep.outputs.build_args }}
          cache-from: type=local,src=${{ steps.prep.outputs.cache }}
          cache-to: type=local,dest=${{ steps.prep.outputs.cache }}-new,mode=max
      - name: 替换本地构建缓存并记录镜像 digest
        env:
          CACHE: ${{ steps.prep.outputs.cache }}
          DIGEST: ${{ steps.retry.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          rm -rf "$CACHE" && mv "$CACHE-new" "$CACHE"
          echo "构建缓存：$(du -sh "$CACHE" | cut -f1)"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::未得到镜像 digest：$DIGEST" >&2; exit 1; }
          echo "镜像 digest：$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 清理凭证与本次镜像标签
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          CACHE: ${{ steps.prep.outputs.cache }}
        run: |
          # 只删本次构建打的标签（已推送的镜像以 GHCR 为准），共享层与其他镜像不受影响。
          for t in $TAGS; do docker image rm "$t" >/dev/null 2>&1 || true; done
          rm -rf "${CACHE:?}-new"
          rm -rf "$RUNNER_TEMP/docker-config"
          [[ ! -e "$RUNNER_TEMP/docker-config" ]] && echo "临时 Docker 凭证目录已删除"
