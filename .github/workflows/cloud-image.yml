name: Cloud Image

on:
  push:
    branches: [main]
    paths: ["cloud/**", ".github/workflows/cloud-image.yml"]
    tags: ["cloud-v*"]
  pull_request:
    paths: ["cloud/Dockerfile", "cloud/.dockerignore", "cloud/go.mod", "cloud/go.sum", "cloud/cmd/**", "cloud/internal/**", ".github/workflows/cloud-image.yml"]

permissions:
  contents: read
  actions: read
  statuses: read

# PR 上新提交取消旧运行；main 与 tag 上每个提交一组、不取消（部署要用，
# 共用一组时排队中的运行会被后来的替换）。
concurrency:
  group: cloud-image-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 只在 PR 上判定复用（与上次成功构建实际检出的 cloud/、.github/ 相同就不再构建）；main 与 tag 每次都构建并推送，部署要用。
  reuse:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.check.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-reuse.sh check "Cloud Image" >> "$GITHUB_OUTPUT"

  image:
    needs: reuse
    # !cancelled()：reuse 在 push 上被跳过时仍要构建。
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.reuse.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: 登录 GHCR（仅推送时）
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # 单仓库自己的包（随本仓库创建、自动授权）；合并前的旧镜像在 ghcr.io/<owner>/yeweiyi-cloud。
          images: ghcr.io/${{ github.repository_owner }}/yeweiyi/cloud
          tags: |
            type=sha
            type=match,pattern=cloud-(v.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: cloud
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cloud-image
          cache-to: type=gha,scope=cloud-image,mode=max
      # PR 上只构建不推送（也不导出镜像），没有 digest。
      - name: 记录镜像 digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::未得到镜像 digest：$DIGEST" >&2; exit 1; }
          echo "镜像 digest：$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 记录本次构建的目录树（供 PR 复用判定）
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-reuse.sh record "Cloud Image"
