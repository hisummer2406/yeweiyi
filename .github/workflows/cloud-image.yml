name: Cloud Image

on:
  push:
    branches: [main]
    paths: ["cloud/**", ".github/workflows/cloud-image.yml"]
    tags: ["cloud-v*"]
  pull_request:
    paths: ["cloud/Dockerfile", "cloud/.dockerignore", "cloud/go.mod", "cloud/go.sum", "cloud/cmd/**", "cloud/internal/**", ".github/workflows/cloud-image.yml"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: 登录 GHCR（仅推送时）
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # 镜像名沿用合并前的 yeweiyi-cloud，部署文档与服务器不用改。
          images: ghcr.io/${{ github.repository_owner }}/yeweiyi-cloud
          tags: |
            type=sha
            type=match,pattern=cloud-(v.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: cloud
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
