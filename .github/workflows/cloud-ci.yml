name: Cloud CI

on:
  push:
    branches: [main]
    paths: ["cloud/**", "!cloud/docs/**", "!cloud/**/*.md", ".github/workflows/cloud-ci.yml"]
  pull_request:
    paths: ["cloud/**", "!cloud/docs/**", "!cloud/**/*.md", ".github/workflows/cloud-ci.yml"]

permissions:
  contents: read
  actions: read

defaults:
  run:
    working-directory: cloud

concurrency:
  group: cloud-ci-${{ github.ref }}
  # main 上不取消：Cloud Deploy 要求所选提交的 Cloud CI 成功，被取消的提交将无法部署。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cloud/go.mod
          # 单仓库里 go.sum 不在根目录，不指定的话 setup-go 找不到依赖文件，缓存整体失效。
          cache-dependency-path: cloud/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "未格式化的文件:"; echo "$out"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - name: 协议契约测试（无容器依赖）
        run: go test ./internal/protocol/

  sqlc-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yeweiyi
          POSTGRES_PASSWORD: yeweiyi
          POSTGRES_DB: yeweiyi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yeweiyi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: postgres://yeweiyi:yeweiyi@localhost:5432/yeweiyi?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cloud/go.mod
          # 单仓库里 go.sum 不在根目录，不指定的话 setup-go 找不到依赖文件，缓存整体失效。
          cache-dependency-path: cloud/go.sum
      # 版本固定：@latest 会让某天 sqlc 一升级，没人改过任何代码 CI 就变红（或悄悄生成不同的输出）。
      # sqlc 与本地生成输出的版本一致；migrate 与 deploy/images.txt、docker-compose.prod.yml 里的镜像一致。
      # 要升级就改这里（版本号和 sha256 一起改），并在同一个提交里重新生成 internal/store/db。
      # 用官方预编译二进制：go install 每次从源码编译要 2 分多钟。
      - name: 安装 sqlc 与 migrate（固定版本）
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/sqlc.tgz https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          echo "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tgz" | sha256sum -c -
          tar -xzf /tmp/sqlc.tgz -C "$HOME/.local/bin" sqlc
          curl -fsSL -o /tmp/migrate.tgz https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz
          echo "2a08137b4720aa457bc760540723e313783f1fab27473463bdcc5fc2e9252959  /tmp/migrate.tgz" | sha256sum -c -
          tar -xzf /tmp/migrate.tgz -C "$HOME/.local/bin" migrate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: sqlc 输出必须与提交一致
        run: |
          sqlc generate
          git diff --exit-code -- internal/store/db
      - name: 迁移 up / down / up 往返
        run: |
          migrate -database "$DB_URL" -path db/migrations up
          migrate -database "$DB_URL" -path db/migrations down -all
          migrate -database "$DB_URL" -path db/migrations up

  # 部署文件：生产 Compose 曾经根本解析不了，端口隔离也曾被叠加文件悄悄撤销。
  # 这里不启动任何容器，只检查配置本身。
  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose version
      - name: 部署脚本语法
        run: |
          for f in deploy/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: 发布脚本失败回滚回归
        run: python3 deploy/test-remote-deploy.py
      - name: Compose 可解析、缺密码会报错、危险端口只绑环回
        run: ./deploy/check-compose.sh

  # 集成测试：真实 PostgreSQL / Redis / ThingsBoard CE。这些测试在基础设施缺失时会自行 Skip，
  # 而 Skip 在 CI 里等于“没测”却显示绿色，所以这里把任何 SKIP 都当成失败。
  integration-reuse:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.check.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # 只有 main 上的代码与 PR 通过时的代码完全相同（合并提交与 PR 头同一棵树）才复用；
      # 分支落后于 main、查询失败等任何其他情况都照常跑全量。
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../.github/scripts/cloud-ci-reuse.sh HEAD >> "$GITHUB_OUTPUT"

  integration:
    needs: integration-reuse
    if: ${{ always() && (github.event_name == 'pull_request' || needs.integration-reuse.outputs.reuse != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://yeweiyi:yeweiyi@localhost:5432/yeweiyi?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cloud/go.mod
          # 单仓库里 go.sum 不在根目录，不指定的话 setup-go 找不到依赖文件，缓存整体失效。
          cache-dependency-path: cloud/go.sum
      - name: 安装 migrate（固定版本，与 sqlc-and-migrations 作业一致）
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/migrate.tgz https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz
          echo "2a08137b4720aa457bc760540723e313783f1fab27473463bdcc5fc2e9252959  /tmp/migrate.tgz" | sha256sum -c -
          tar -xzf /tmp/migrate.tgz -C "$HOME/.local/bin" migrate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 启动 PostgreSQL / Redis / ThingsBoard
        run: docker compose -f docker-compose.yml -f docker-compose.thingsboard.yml up -d postgres redis thingsboard
      - name: 等待就绪（ThingsBoard 首次启动要装 schema，2–4 分钟）
        run: |
          for i in $(seq 1 90); do
            # 不能只探 /login 页面，也不能只看 curl 退出码：ThingsBoard 初始化到一半时，登录接口会
            # 302 重定向到 /login（curl -f 只把 >=400 当失败，302 会被当成成功）。要求 200 且返回 token。
            body="$(curl -s -m 5 -X POST http://localhost:8081/api/auth/login \
                 -H 'Content-Type: application/json' \
                 -d '{"username":"tenant@thingsboard.org","password":"tenant"}' || true)"
            if printf '%s' "$body" | grep -q '"token"'; then
              echo "ThingsBoard 就绪（${i}）"; exit 0
            fi
            sleep 5
          done
          echo "ThingsBoard 未在 450 秒内就绪" >&2
          docker compose -f docker-compose.yml -f docker-compose.thingsboard.yml logs --tail 80 thingsboard
          exit 1
      - name: 业务库迁移与 ThingsBoard 设备配置
        run: |
          migrate -database "$DATABASE_URL" -path db/migrations up
          go run ./cmd/tbconfig apply
      - name: 全量测试（串行）
        run: |
          set -o pipefail
          go test ./... -p 1 -v 2>&1 | tee test.log
      - name: 不允许有 Skip
        run: |
          if grep -E '^\s*--- SKIP' test.log; then
            echo "存在被跳过的测试：基础设施没有真正跑起来，或有测试被悄悄禁用。" >&2
            exit 1
          fi
      - name: 失败时输出 ThingsBoard 日志
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.thingsboard.yml logs --tail 120 thingsboard
