name: Admin CI/CD

on:
  push:
    branches: [main]
    paths: ["admin/**", ".github/workflows/admin-ci.yml"]
  pull_request:
    paths: ["admin/**", ".github/workflows/admin-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: admin

# 不取消正在切换线上版本的发布；旧提交在部署前检查是否仍为 main 最新版本。
concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-build:
    runs-on: [self-hosted, linux, x64, yeweiyi-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # 不用 setup-node 的 GitHub 缓存：npm 缓存由 Runner .env 的 npm_config_cache 固定在本机持久目录。
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: 本地缓存路径与命中
        run: ../.github/scripts/ci-cache-check.sh npm before
      # 仍按锁文件安装（npm ci），离线优先只是先查本地缓存，缺的照常联网下载。
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - name: 发布脚本检查和回滚测试
        run: |
          bash -n deploy/remote-deploy.sh
          python3 deploy/test-remote-deploy.py
      - run: npm run build
        env:
          MOCK: none
          COMMIT_HASH: ${{ github.sha }}
      - name: 记录版本和文件校验和
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$RELEASE_SHA" > dist/release.txt
          cd dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cd ..
          # exportStatic 动态路由目录含冒号，artifact 不接受此类文件名。
          tar -czf admin-dist.tar.gz -C dist .
      # 这是 check-build → deploy 之间交付同一构建产物的通道（部署前校验 release.txt 与 SHA256SUMS），
      # 不是缓存，保留。
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/admin-dist.tar.gz
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: check-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, yeweiyi-ci]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      TARGET_HOST: ${{ secrets.ADMIN_DEPLOY_HOST }}
      TARGET_USER: ${{ secrets.ADMIN_DEPLOY_USER }}
      TARGET_PORT: ${{ secrets.ADMIN_DEPLOY_PORT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin/artifact
      - name: 解包构建产物
        run: |
          mkdir dist
          tar -xzf artifact/admin-dist.tar.gz -C dist
      - name: 校验 main 版本及配置
        id: gate
        run: |
          # 单仓库里 main 之后可能只有别的目录的提交，它们不会再触发本工作流；
          # 只要 admin/ 在 RELEASE_SHA 之后没变，本次仍是最新的后台版本。
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          git fetch -q origin main
          if ! git diff --quiet "$RELEASE_SHA" "$latest" -- . ../.github/workflows/admin-ci.yml; then
            echo 'main 已更新，跳过旧版本发布'
            echo 'current=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$TARGET_HOST" =~ ^[A-Za-z0-9.-]+$ && "$TARGET_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${TARGET_PORT:-22}" =~ ^[0-9]+$ ]]
          [[ "$(cat dist/release.txt)" == "$RELEASE_SHA" ]]
          (cd dist && sha256sum -c SHA256SUMS >/dev/null)
          echo 'current=true' >> "$GITHUB_OUTPUT"
      - name: 配置专用 SSH 密钥
        if: steps.gate.outputs.current == 'true'
        env:
          KEY: ${{ secrets.ADMIN_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ADMIN_DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ -n "$KEY" && -n "$KNOWN_HOSTS" ]]
          # 自托管 Runner 的 HOME 跨 job 持久：私钥与主机公钥只放本 job 的 RUNNER_TEMP，最后 always 删除。
          install -m 700 -d "$RUNNER_TEMP/ssh"
          (umask 077; printf '%s\n' "$KEY" > "$RUNNER_TEMP/ssh/id_deploy")
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
      - name: 上传已验证产物并发布
        if: steps.gate.outputs.current == 'true'
        run: |
          set -euo pipefail
          # 只用这把专用密钥、这份主机公钥；不读 Runner 用户的 ~/.ssh 和 ssh-agent。
          SSH=(ssh -F /dev/null -i "$RUNNER_TEMP/ssh/id_deploy" -o IdentitiesOnly=yes -o IdentityAgent=none
               -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null
               -p "${TARGET_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          TARGET="$TARGET_USER@$TARGET_HOST"
          RELEASE="${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STAGING="$("${SSH[@]}" "$TARGET" 'mktemp -d /home/www/yeweiyi-admin/ci-XXXXXXXX')"
          [[ "$STAGING" =~ ^/home/www/yeweiyi-admin/ci-[A-Za-z0-9]+$ ]]
          trap '"${SSH[@]}" "$TARGET" "rm -rf -- '\''$STAGING'\''" || true' EXIT
          tar -czf - deploy/remote-deploy.sh dist | "${SSH[@]}" "$TARGET" "tar -xzf - -C '$STAGING'"
          "${SSH[@]}" "$TARGET" "set -eu; cd '$STAGING/dist'; sha256sum -c SHA256SUMS >/dev/null; mkdir '/var/www/yeweiyi-admin/releases/$RELEASE'; cp -R . '/var/www/yeweiyi-admin/releases/$RELEASE/'; chmod -R a+rX '/var/www/yeweiyi-admin/releases/$RELEASE'; bash '$STAGING/deploy/remote-deploy.sh' '$RELEASE'"
      - name: 清理 Runner SSH 凭据
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ssh"
          [[ ! -e "$RUNNER_TEMP/ssh" ]] && echo "SSH 私钥与主机公钥已删除"
