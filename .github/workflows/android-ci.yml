name: Android CI

# 2026-11-26 起不再随 PR 或 main 推送自动运行：Android 单测由专门的 Android 开发同事在自己的环境执行，
# 见 .github/ci/README.md「Android 单测交接」。只保留手动入口；作业仍在托管 Runner 上，受 Actions 预算限制。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      # Gradle 6.7.1 / AGP 4.2 不支持 JDK 17，固定 11。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle
      - name: 共享 fixture 与 MANIFEST 一致
        working-directory: cloud
        run: bash fixtures/protocol/v1/verify-manifest.sh
      # 不需要 local.properties / keystore：缺失时只告警，debug 单测照常编译。
      - name: 单元测试
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
