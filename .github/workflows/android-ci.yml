name: Android CI

# 改 android/ 或共享 fixture（cloud/fixtures/）都要跑：fixture 只有一份，两端测试共用。
on:
  push:
    branches: [main]
    paths: ["android/**", "cloud/fixtures/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["android/**", "cloud/fixtures/**", ".github/workflows/android-ci.yml"]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      # Gradle 6.7.1 / AGP 4.2 不支持 JDK 17，固定 11。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle
      - name: 共享 fixture 与 MANIFEST 一致
        working-directory: cloud
        run: bash fixtures/protocol/v1/verify-manifest.sh
      # 不需要 local.properties / keystore：缺失时只告警，debug 单测照常编译。
      - name: 单元测试
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
