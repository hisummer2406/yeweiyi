apply plugin: 'com.android.application'
// 新增类一律用 Kotlin，已有 Java 代码不改写
apply plugin: 'kotlin-android'

// ---------------------------------------------------------------------------
// 敏感配置：构建期从 local.properties 注入，不再硬编码进源码。
// local.properties 不进版本库；新环境照 local.properties.template 填写。
// ---------------------------------------------------------------------------
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def secretField = { String propertyName ->
    def value = localProperties.getProperty(propertyName)
    if (value == null || value.trim().isEmpty()) {
        logger.warn("[配置缺失] local.properties 中没有 ${propertyName}，" +
                "将编译为空字符串，相关功能(MQTT上报/接口加密)会失效。参见 local.properties.template")
        value = ""
    }
    return "\"${value}\""
}
// 开关类配置：与 secretField 走同一条 local.properties -> BuildConfig 通道，
// 但缺失时不告警 —— 缺失就是默认值 false，是正常状态而非配置遗漏。
def flagField = { String propertyName ->
    def value = localProperties.getProperty(propertyName)
    return Boolean.parseBoolean(value == null ? "false" : value.trim()).toString()
}

// ---------------------------------------------------------------------------
// 正式包签名：keystore 文件本体固定放在 app/keystore/release.jks（.gitignore 排除，
// 不进版本库），用 tools/generate-release-keystore.sh 生成；密码/别名和其余敏感配置
// 一样走 local.properties。三项有一项缺失就不装配 signingConfig —— release 构建仍然
// 能跑（供本机验证编译用），只是产物不签名、装不到设备，而不是静默用错误的 key 签出去。
// ---------------------------------------------------------------------------
def releaseKeystoreFile = rootProject.file('app/keystore/release.jks')
def releaseStorePassword = localProperties.getProperty('sansen.releaseStorePassword')
def releaseKeyAlias = localProperties.getProperty('sansen.releaseKeyAlias')
def releaseKeyPassword = localProperties.getProperty('sansen.releaseKeyPassword')
def releaseSigningReady = releaseKeystoreFile.exists() &&
        releaseStorePassword?.trim() && releaseKeyAlias?.trim() && releaseKeyPassword?.trim()
if (!releaseSigningReady) {
    logger.warn("[配置缺失] 正式签名未就绪：app/keystore/release.jks 不存在，或 local.properties 中 " +
            "sansen.releaseStorePassword / sansen.releaseKeyAlias / sansen.releaseKeyPassword 有缺失。" +
            "release 产物将不签名，无法安装到设备。先跑 tools/generate-release-keystore.sh，" +
            "再按 local.properties.template 填密码。")
}

android {
    // Java 与 Kotlin 的编译目标保持一致；AGP 4.2 默认就是 1.8，这里写明，升级 AGP 时不会悄悄改变
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    // 协议 V1 共享 fixture 只有一份，在单仓库的 cloud/fixtures/protocol/v1/（云端 MANIFEST 校验和管着它）。
    // 直接挂到测试 classpath，测试仍按 /protocol/v1/<name> 读取；不要再在 android/ 下放副本。
    sourceSets {
        test.resources.srcDirs += [rootProject.file('../cloud/fixtures')]
    }
    compileSdkVersion 27
    defaultConfig {
        applicationId "com.sansen.yeweiyi"
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 5
        versionName "1.0.5-H"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "PRODUCT_KEY", secretField('sansen.productKey')
        buildConfigField "String", "PRODUCT_SECRET", secretField('sansen.productSecret')
        buildConfigField "String", "REQUEST_ENCRYPT_KEY", secretField('sansen.requestEncryptKey')
        buildConfigField "String", "BASE_URL", secretField('sansen.baseUrl')
        // 探头报文录制开关，默认关闭。见 manager/ProbeTrafficRecorder。
        buildConfigField "boolean", "PROBE_RECORDING", flagField('sansen.probeRecording')
        // ThingsBoard MQTT 是否走 TLS，默认关闭（明文，方便本地/开发环境联调）。
        // 生产部署应开启；每台设备的连接凭据是运行期配网写入的 access token，
        // 不走这条构建期通道——见 manager/ThingsBoardCredentialStore。
        buildConfigField "boolean", "THINGSBOARD_USE_TLS", flagField('sansen.thingsboardUseTls')
        // ThingsBoard 设备自助注册（Provisioning）用的 key/secret，同型号设备共用；
        // 设备只凭它和手输的编号领自己的 access token，见 ThingsBoardManager。
        buildConfigField "String", "PROVISION_DEVICE_KEY", secretField('sansen.provisionDeviceKey')
        buildConfigField "String", "PROVISION_DEVICE_SECRET", secretField('sansen.provisionDeviceSecret')
        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions"
            }
        }
        multiDexEnabled true
    }
    /**
     * 忽略 9patch
     */
    aaptOptions {
        cruncherEnabled = false
        useNewCruncher = false
    }

    packagingOptions {
        exclude 'META-INF/NOTICE' // will not include NOTICE file
        exclude 'META-INF/LICENSE' // will not include LICENSE file
        exclude 'META-INF/DEPENDENCIES'
    }
//    //自动追加版本号和版本名称
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "app_" + defaultConfig.versionName + "_" + new Date().format("yyyy-MM-dd") + "_" + buildType.name + ".apk"
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    dexOptions {
        jumboMode = true
        javaMaxHeapSize "4g"
    }

//    afterEvaluate {
//        tasks.matching {
//            it.name.startsWith('dex')
//        }.each { dx ->
//            if (dx.additionalParameters == null) {
//                dx.additionalParameters = ['--multi-dex']
//            } else {
//                dx.additionalParameters += '--multi-dex'
//            }
//        }
//    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    //导入dataBinding支持
    dataBinding {
        enabled true
    }

}

