services:
  postgres:
    image: postgres:16
    container_name: yeweiyi-postgres
    environment:
      POSTGRES_USER: yeweiyi
      POSTGRES_PASSWORD: yeweiyi
      POSTGRES_DB: yeweiyi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yeweiyi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: yeweiyi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local stand-in for the Aliyun IoT broker, which isn't provisioned yet (see CLAUDE.md "MQTT
  # contract"). Anonymous auth, no TLS — fine for localhost-only dev, not representative of the
  # real broker's auth model.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: yeweiyi-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./dev/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
