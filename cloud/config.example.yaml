# yeweiyi-cloud 运行配置示例
#
# 用法：
#   cp config.example.yaml config.yaml
#   go run ./cmd/server -config config.yaml
#
# 优先级（低 → 高）：内置默认值 → 本文件 → 环境变量。
# 环境变量优先，是为了让容器/systemd 能覆盖单个值而不必改镜像里的文件。
#
# 本文件里**所有键都是可选的**，省略即用默认值（下面每项都标了默认值）。
# 但拼错的键会导致启动失败而不是被静默忽略——尤其 allowPhysicalCommands，
# 一个拼错却"看起来生效"的开关是最坏的情况。
#
# 时间一律写成 "30s" / "5m" / "24h" 这种带单位的字符串，不接受裸数字：
# 裸数字在 Go 里默认是纳秒，30 会变成 30 纳秒，把 30 秒的清扫变成死循环。

server:
  # 默认 ":8080"。注意本地开发时 ThingsBoard 控制台占用 8081。
  listenAddr: ":8080"

  # TLS/HTTPS 配置（可选）。两个字段都设置时启用 HTTPS；留空则只用 HTTP。
  # 路径相对于工作目录或绝对路径；环境变量：TLS_CERT_FILE、TLS_KEY_FILE。
  # 示例（自签证书）：
  #   tlsCertFile: "/etc/yeweiyi/server.crt"
  #   tlsKeyFile: "/etc/yeweiyi/server.key"
  # 或用 Let's Encrypt（仅限公网）。
  tlsCertFile: ""
  tlsKeyFile: ""

database:
  # 默认 postgres://yeweiyi:yeweiyi@localhost:5432/yeweiyi?sslmode=disable
  # 生产环境建议用环境变量 DATABASE_URL 传入，避免密码进配置备份。
  url: "postgres://yeweiyi:yeweiyi@localhost:5432/yeweiyi?sslmode=disable"

redis:
  # 默认 localhost:6379
  addr: "localhost:6379"
  # Redis 的 requirepass。开发用的 compose 不设密码，留空即可；生产必须设置，且与 compose 里
  # 的 REDIS_PASSWORD 一致。**建议只用环境变量 REDIS_PASSWORD 传入**，不要写进本文件。
  # password: ""

auth:
  # ⚠️ 必填，且**建议只用环境变量 JWT_SECRET 传入**，不要写进本文件——
  # 配置文件会进备份、可能进 git，密钥不该出现在这两个地方。
  # 这里留空即表示"从环境变量取"。
  jwtSecret: ""
  # 登录令牌有效期。默认 "24h"。
  # 令牌只证明"你是谁"：角色、所属客户、是否被停用每次请求都读数据库，所以这些变更立即生效，
  # 不必等令牌过期。缩短这个值只影响用户多久需要重新登录。
  tokenTTL: "24h"
  # 滑动续期：令牌剩余有效期不足 tokenTTL 的一半时，受保护接口的响应会带 `X-Renewed-Token`，
  # 客户端换用即可，用户不必每天重新登录。已停用/已删除的用户拿不到新令牌，已过期的令牌不续期。
  # maxSessionAge 是自上次输入密码起的绝对上限：到点后无论怎么续期都必须重新登录。默认 "720h"（30 天），
  # 不得小于 tokenTTL。
  maxSessionAge: "720h"

thingsboard:
  # 留空 = 不启用 ThingsBoard：服务照常启动，但设备与控制相关端点返回 503 并说明原因。
  # 这个模式是为了让只改业务端点的开发不必先跑起一个 2GB 容器。
  baseURL: "http://localhost:8081"
  username: "tenant@thingsboard.org"
  # 同 jwtSecret，生产建议走环境变量 TB_PASSWORD。
  password: "tenant"

control:
  # 控制命令的有效期。设备端与云端清扫都会检查。
  # 默认 "60s"。**这是一个占位值，不是产品决定**（见 docs/protocol-v1.md 第 12 节）。
  #
  # 它防的是：命令在断网期间卡在队列里，几小时后操作员早已离开，泵却突然启动。
  # 因此这个值应该按"操作员发出指令后还愿意站在现场等多久"来定，而不是按网络状况定。
  commandTTL: "60s"

  # 等待设备 ACK 的时间。默认 "10s"。
  # 它**只约束"设备是否收到"，不约束"设备执行完没有"**——重启这类动作会在很久之后
  # 才通过异步的 cmdResult 上报结果。
  # 必须小于 commandTTL，否则命令会在设备来得及应答之前就过期（启动时会校验）。
  ackTimeout: "10s"

  # 清扫过期命令的频率。默认 "30s"。必须不大于 commandTTL，否则过期命令最多要挂
  # 一整个清扫周期才被关掉（启动时会校验）。
  expirySweepInterval: "30s"

  # ⚠️⚠️ 物理动作总闸：启泵、停泵、开阀、关阀、重启设备。
  #
  # 默认 false，**在设备端联锁补齐并完成真机验证之前必须保持 false**（见 issue #1）。
  # 这是本文件里唯一一个填错会让现场设备真的动起来的开关。
  #
  # 该闸门对平台管理员同样生效——它约束的是未经验证的硬件，不是信任级别。
  # 打开它不会绕过任何权限检查，只是让这些方法不再被整体拒绝。
  allowPhysicalCommands: false

telemetry:
  # ThingsBoard 保留原始 30 秒遥测多久，必须与部署的 TS_RETENTION_SECONDS 一致（issue #30）。
  # 趋势接口对比它新的部分读 ThingsBoard，更早的部分读业务库的小时汇总，且更早部分不支持小于 1h 的粒度。
  # TTL 尚未开启时也请填真实目标值：它只决定接口从哪里起不再信任原始数据。默认 "168h"（7 天）。
  retention: "168h"
  # 小时汇总任务的运行频率。默认 "1h"。
  rollupInterval: "1h"
  # 每次运行往回重算多久，用来吸收离线设备迟到的补投。默认 "48h"。
  # 服务停机更久也不会留洞：每次运行至少从"已汇总的最后一小时之后"开始。
  rollupRecompute: "48h"

ingest:
  # 重新读取设备列表的频率，用于给新绑定的设备建立遥测订阅。默认 "30s"。
  # 调小 = 新设备更快开始被采集，代价是更频繁的数据库查询。
  deviceRefreshInterval: "30s"
  # 订阅断开后重连前的等待。默认 "5s"。
  resubscribeDelay: "5s"
  # 出入库与报警是业务记录，业务库是长期事实来源（issue #29）。实时订阅每个批次只交付每个 key 的
  # 最新点，设备离线补投的旧记录也可能晚到，所以每台设备还会定时回读 ThingsBoard 最近一段时间，
  # 靠幂等写入去重。默认 "10m"。调小 = 缺口更快补上，代价是更多 ThingsBoard 读取。
  recordReconcileInterval: "10m"
  # 每次回读往回看多远，必须不短于设备离线后补投的最长间隔。默认 "192h"（8 天，比 7 天遥测保留期多 1 天）。
  # 业务库里一条记录都没有的设备（首次接管）会自动从头全量回补，不受此限制；
  # 已有记录的设备要补更早的历史，用 `go run ./cmd/backfill`。
  recordReconcileLookback: "192h"
  # 设备在线状态（devices.is_online，小程序设备页用）从 ThingsBoard 的设备 active 标志定时同步。默认 "30s"。
  # active 表示"不活动超时内有过活动"，设备掉线后要等 ThingsBoard 的不活动超时（默认 10 分钟，可在
  # 设备配置文件里改）才变为离线；这里只决定在那之上再多等多久，调小不能让离线判定比超时更快。
  onlineStatusInterval: "30s"

pairing:
  # 扫码绑定只携带 6 位短码（二维码内容 `000001`，设备登记名 `ZCT000001`）。云端先按原文精确匹配
  # 调用者所属客户的设备，再依次匹配"前缀+原文"。空列表 = 只精确匹配。
  codePrefixes: ["ZCT"]

stock:
  # 出入库记录的"设备固件已升级"时间点，RFC3339 且必须带时区偏移。默认不设置。
  #
  # 为什么需要它：设备端把 stockEvent 改成 JSON（zhongchengyeweiyi#39）之后，**不会**转换
  # ThingsBoard 里已有的旧记录——那些 DetailInoutRecord.toString() 调试字符串永远读不出来。
  # 若没有这个边界，任何回看到升级之前的查询窗口都会一直返回 502，接口就从"暂时诚实地失败"
  # 变成"永久损坏"。而两种记录的载荷是一模一样的，只有时间能区分。
  #
  #   早于该时间点且解析失败  → 已知且已封口的历史数据空洞：计入 legacySkipped，仍返回 200
  #   晚于等于该时间点且失败  → 有设备该升级而没升级：返回 502，需要有人去现场看
  #
  # 不设置 = "还没升级"，任何解析失败都按当前故障处理。这是正确的默认：没人告诉过它车队已经
  # 升级的部署，不应该自作主张地把读不出来的记录一笔勾销。
  # 设置成车队完成固件升级的时刻，例如：
  # legacyFormatBefore: "2026-10-01T00:00:00+08:00"

# ---------------------------------------------------------------------------
# 环境变量对照（覆盖本文件对应项）
#
#   LISTEN_ADDR                      server.listenAddr
#   DATABASE_URL                     database.url
#   REDIS_ADDR                       redis.addr
#   REDIS_PASSWORD                   redis.password
#   JWT_SECRET                       auth.jwtSecret
#   TOKEN_TTL                        auth.tokenTTL
#   TOKEN_MAX_SESSION_AGE            auth.maxSessionAge
#   TB_BASE_URL / TB_USERNAME / TB_PASSWORD   thingsboard.*
#   COMMAND_TTL                      control.commandTTL
#   COMMAND_ACK_TIMEOUT              control.ackTimeout
#   COMMAND_EXPIRY_SWEEP_INTERVAL    control.expirySweepInterval
#   ALLOW_PHYSICAL_COMMANDS          control.allowPhysicalCommands  (true/false/1/0)
#   INGEST_DEVICE_REFRESH_INTERVAL   ingest.deviceRefreshInterval
#   INGEST_RESUBSCRIBE_DELAY         ingest.resubscribeDelay
#   INGEST_RECORD_RECONCILE_INTERVAL ingest.recordReconcileInterval
#   INGEST_RECORD_RECONCILE_LOOKBACK ingest.recordReconcileLookback
#   INGEST_ONLINE_STATUS_INTERVAL    ingest.onlineStatusInterval
#   TELEMETRY_RETENTION              telemetry.retention
#   TELEMETRY_ROLLUP_INTERVAL        telemetry.rollupInterval
#   TELEMETRY_ROLLUP_RECOMPUTE       telemetry.rollupRecompute
#   STOCK_LEGACY_FORMAT_BEFORE       stock.legacyFormatBefore
#   PAIRING_CODE_PREFIXES            pairing.codePrefixes（逗号分隔；"-" 表示清空）
#
# 未在此列出的项只能通过配置文件设置。
# ---------------------------------------------------------------------------
